<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>iPod Mini Player - Aluminio Unificado</title>
    <style>
        /* Cuerpo del iPod Mini con tamaño y posición */
        .ipod-mini {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #3A3D40 0%, #181A1B 100%);
            width: 260px;
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 
                        0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            user-select: none;
            border: 1px solid #111;

            /* Ubicación y Tamaño */
            margin: 4px;            
            transform: scale(0.5);        
            transform-origin: top left; 
        }

        /* Pantalla LCD */
        .pantalla-lcd {
            background-color: #CBD5C0; 
            width: 100%;
            height: 90px;
            border-radius: 6px;
            border: 3px solid #222;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #2B302A; 
        }

        .info-pista {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .tiempos {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
        }

        /* Barra de progreso */
        .progreso-contenedor {
            width: 100%;
            margin-top: 5px;
        }

        .barra-progreso {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: #A6B49A;
            border: 1px solid #55604D;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .barra-progreso::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 6px;
            height: 14px;
            background: #2B302A;
            cursor: pointer;
            border-radius: 1px;
        }

        .barra-progreso::-moz-range-thumb {
            width: 6px;
            height: 14px;
            background: #2B302A;
            cursor: pointer;
            border-radius: 1px;
            border: none;
        }

        /* Click Wheel Blanca */
        .click-wheel {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #EAEAEA 0%, #DCDCDC 30%, #E8E8E8 70%, #CECECE 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.6);
            border: 1px solid #A8A8A8;
        }

        /* Botón Central Play/Pausa */
        .btn-play-central {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #3A3D40 0%, #202224 100%);
            color: #FFFFFF;
            border-radius: 50%;
            border: 1px solid #111;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.2);
            z-index: 10;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-play-central:active {
            transform: translate(-50%, -50%) scale(0.95);
            background: #181A1B;
        }

        /* Botón MENU */
        .btn-menu {
            position: absolute;
            top: 8px; 
            left: 50%; 
            transform: translateX(-50%);
            background: none;
            border: none;
            color: #666;
            font-size: 12px;
            font-weight: bold;
            cursor: default;
        }

        /* Botones laterales */
        .btn-nav-lateral {
            position: absolute;
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 40px;
            top: 50%;
            transform: translateY(-50%);
            padding: 0;
        }

        .btn-nav-lateral:active {
            color: #000;
        }

        .btn-nav-lateral .icono {
            font-size: 14px;
            font-weight: bold;
            line-height: 1;
        }

        .btn-nav-lateral .texto-pequeno {
            font-size: 8px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        .btn-ant { left: 6px; }
        .btn-sig { right: 6px; }
    </style>
</head>
<body>

    <!-- Contenedor iPod Mini -->
    <div class="ipod-mini">
        
        <!-- Pantalla LCD -->
        <div class="pantalla-lcd">
            <div id="info-pista" class="info-pista">Audio 1</div>
            
            <div class="progreso-contenedor">
                <input type="range" id="barra-progreso" class="barra-progreso" value="0" min="0" max="100" step="0.1">
            </div>

            <div class="tiempos">
                <span id="tiempo-actual">0:00</span>
                <span id="tiempo-total">0:00</span>
            </div>
        </div>

        <!-- Rueda de Clics -->
        <div class="click-wheel">
            <span class="btn-menu">MENU</span>
            
            <!-- Botón Anterior -->
            <button id="btn-anterior" class="btn-nav-lateral btn-ant">
                <span class="icono">◀◀</span>
                <span class="texto-pequeno">Ant.</span>
            </button>

            <!-- Botón Siguiente -->
            <button id="btn-siguiente" class="btn-nav-lateral btn-sig">
                <span class="icono">▶▶</span>
                <span class="texto-pequeno">Sig.</span>
            </button>
            
            <!-- Botón de Play/Pausa -->
            <button id="btn-play-pausa" class="btn-play-central">▶</button>
        </div>

    </div>

    <!-- Elemento de Audio NATIVO -->
    <audio id="mi-audio"></audio>

    <script>
        const listaAudios = [
            "audio/sonido1.mp3",
            "audio/sonido2.mp3",
            "audio/sonido3.mp3",
            "audio/sonido4.mp3"
        ];

        let indiceActual = 0;
        const reproductor = document.getElementById("mi-audio");
        const btnAnterior = document.getElementById("btn-anterior");
        const btnPlayPausa = document.getElementById("btn-play-pausa");
        const btnSiguiente = document.getElementById("btn-siguiente");
        
        const barraProgreso = document.getElementById("barra-progreso");
        const tiempoActualTxt = document.getElementById("tiempo-actual");
        const tiempoTotalTxt = document.getElementById("tiempo-total");
        const infoPista = document.getElementById("info-pista");

        reproductor.src = listaAudios[indiceActual];
        actualizarTextoPista();

        btnPlayPausa.addEventListener("click", () => {
            if (reproductor.paused) {
                reproductor.play()
                    .then(() => btnPlayPausa.textContent = "||")
                    .catch(err => console.log("Error al reproducir: ", err));
            } else {
                reproductor.pause();
                btnPlayPausa.textContent = "▶";
            }
        });

        btnSiguiente.addEventListener("click", () => {
            indiceActual = (indiceActual + 1) % listaAudios.length;
            cambiarPista(indiceActual);
        });

        btnAnterior.addEventListener("click", () => {
            indiceActual = (indiceActual - 1 + listaAudios.length) % listaAudios.length;
            cambiarPista(indiceActual);
        });

        function cambiarPista(indice) {
            reproductor.src = listaAudios[indice];
            reproductor.load();
            actualizarTextoPista();
            reproductor.play()
                .then(() => btnPlayPausa.textContent = "||")
                .catch(() => btnPlayPausa.textContent = "▶");
        }

        function actualizarTextoPista() {
            infoPista.textContent = `Audio ${indiceActual + 1}`;
        }

        function formatearTiempo(segundos) {
            if (isNaN(segundos)) return "0:00";
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return `${min}:${seg < 10 ? '0' : ''}${seg}`;
        }

        reproductor.addEventListener("timeupdate", () => {
            if (reproductor.duration) {
                const porcentaje = (reproductor.currentTime / reproductor.duration) * 100;
                barraProgreso.value = porcentaje;
                tiempoActualTxt.textContent = formatearTiempo(reproductor.currentTime);
            }
        });

        reproductor.addEventListener("loadedmetadata", () => {
            tiempoTotalTxt.textContent = formatearTiempo(reproductor.duration);
        });

        barraProgreso.addEventListener("input", () => {
            if (reproductor.duration) {
                const nuevoTiempo = (barraProgreso.value / 100) * reproductor.duration;
                reproductor.currentTime = nuevoTiempo;
            }
        });

        reproductor.addEventListener("ended", () => {
            btnSiguiente.click();
        });
    </script>
</body>
</html>

<!-- Bloque Admin -->
<div id="bloque-admin" style="display: none; background: #000000; color: #00ff00; padding: 15px; margin: 20px 0; border-radius: 8px; border: 2px solid #00ff00; font-family: monospace; text-align: center; font-size: 1.1em;">
  📊 MODO ADMIN ACTIVADO <br>
  Vistas totales reales: <strong id="vistas">Cargando...</strong>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var direccionWeb = window.location.href.toLowerCase();
    
    // Identificamos si estás navegando como Administrador
    var esAdmin = direccionWeb.indexOf("admin") !== -1;

    // Si eres Admin, solo LEEMOS el número. Si eres usuario normal, INCREMENTAMOS (+1).
    var urlContador = esAdmin 
      ? "https://counterapi.dev" 
      : "https://counterapi.dev/increment";

    // Hacemos la consulta correspondiente al servidor
    fetch(urlContador)
      .then(function(res) { 
        return res.json(); 
      })
      .then(function(response) {
        var elementoVistas = document.getElementById("vistas");
        if (elementoVistas && response.count !== undefined) {
          elementoVistas.innerText = response.count; 
        }
      })
      .catch(function(err) {
        console.warn("Error al conectar con la base de datos:", err);
        var elementoVistas = document.getElementById("vistas");
        if (elementoVistas) {
          elementoVistas.innerText = "Error de red";
        }
      });

    // Si se detecta la palabra secreta, revelamos el recuadro verde en pantalla
    if (esAdmin) {
      var panelAdmin = document.getElementById("bloque-admin");
      if (panelAdmin) {
        panelAdmin.style.display = "block";
      }
    }
  });
</script>
