<head>

    <meta charset="UTF-8">

    <title>Rolando</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh; 
            background-image: url('img/img.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
        }

        .contenido-principal {
            max-width: 730px;
            margin: 0 auto; 
            padding: 20px;
            position: relative;
        }

        /* Cuerpo del iPod Mini con tamaño y posición */
        .ipod-mini {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #3A3D40 0%, #181A1B 100%);
            width: 260px;
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 
                        0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            user-select: none;
            border: 1px solid #111;

            /* Ubicación y Tamaño */
            margin: 4px;            
            transform: scale(0.5);        
            transform-origin: top left; 
        }

        /* Pantalla LCD */
        .pantalla-lcd {
            background-color: #CBD5C0; 
            width: 100%;
            height: 90px;
            border-radius: 6px;
            border: 3px solid #222;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #2B302A; 
        }

        .info-pista {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .tiempos {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
        }

        /* Barra de progreso */
        .progreso-contenedor {
            width: 100%;
            margin-top: 5px;
        }

        .barra-progreso {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: #A6B49A;
            border: 1px solid #55604D;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .barra-progreso::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 6px;
            height: 14px;
            background: #2B302A;
            cursor: pointer;
            border-radius: 1px;
        }

        .barra-progreso::-moz-range-thumb {
            width: 6px;
            height: 14px;
            background: #2B302A;
            cursor: pointer;
            border-radius: 1px;
            border: none;
        }

        /* Click Wheel */
        .click-wheel {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #EAEAEA 0%, #DCDCDC 30%, #E8E8E8 70%, #CECECE 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.6);
            border: 1px solid #A8A8A8;
        }

        /* Botón Central Play/Pausa */
        .btn-play-central {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #3A3D40 0%, #202224 100%);
            color: #FFFFFF;
            border-radius: 50%;
            border: 1px solid #111;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.2);
            z-index: 10;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-play-central:active {
            transform: translate(-50%, -50%) scale(0.95);
            background: #181A1B;
        }

        /* Botón MENU */
        .btn-menu {
            position: absolute;
            top: 8px; 
            left: 50%; 
            transform: translateX(-50%);
            background: none;
            border: none;
            color: #666;
            font-size: 12px;
            font-weight: bold;
            cursor: default;
        }

        /* Botones laterales */
        .btn-nav-lateral {
            position: absolute;
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 40px;
            top: 50%;
            transform: translateY(-50%);
            padding: 0;
        }

        .btn-nav-lateral:active { color: #000; }
        .btn-nav-lateral .icono { font-size: 14px; font-weight: bold; line-height: 1; }
        .btn-nav-lateral .texto-pequeno { font-size: 8px; font-weight: bold; text-transform: uppercase; margin-top: 2px; letter-spacing: 0.3px; }
        .btn-ant { left: 6px; }
        .btn-sig { right: 6px; }
    </style>
</head>
<body>

    <div class="contenido-principal">
        <center>
            <h1 style="color:#DEDEF7; font-size: 40px;">Hola Mundo</h1>

            <p style="color:#DEDEF7; font-size: 18px; margin-right: 280px">En caso de que no los vea, Buenos dias, Buenas tardes y Buenas noches...</p>   
        </center>

        <p style="color:#DEDEF7; font-size: 18px; margin-right: 30px">Dale play y disfruta...</p>

        <div class="ipod-mini">

                <button id="btn-siguiente" class="btn-nav-lateral btn-sig">

                <!-- Botón Central Estructural Correcto -->

        </div>

          📊 Vistas totales (Modo Admin): <span id="numero-vistas-privado" style="font-weight: bold; color: #1db954;">0</span>
        </div>
        <!-- ========================================================= -->

    </div>
